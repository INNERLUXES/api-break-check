# The example orders API of examples/v1.json, written as YAML.
openapi: '3.0.3'
info:
  title: Orders API
  version: '1.4.0'
  description: >-
    A made-up orders API
    for the api-break-check example.
# Clients reach the API here.
servers:
  - url: 'https://api.example.com/v1'
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            maximum: 100
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOrder
      responses:
        '200':
          description: One order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No such order
    delete:
      operationId: cancelOrder
      responses:
        '204':
          description: Cancelled
  /orders/{orderId}/receipt:
    get:
      operationId: getReceipt
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The receipt
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
  /customers/{customerId}/orders:
    get:
      operationId: listCustomerOrders
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Orders of one customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
  responses:
    BadRequest:
      description: The request was not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OrderStatus:
      type: string
      enum: [pending, paid, shipped, cancelled]
    NewOrder:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewOrderItem'
        note:
          type: string
          maxLength: 500
    NewOrderItem:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      required: [id, status, total, currency, items]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: number
        currency:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        note:
          type: string
        replacementFor:
          $ref: '#/components/schemas/Order'
    OrderItem:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
          format: int32
        price:
          type: number
    OrderSummary:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: number
    OrderCreated:
      type: object
      required: [id]
      properties:
        id:
          type: string
    OrderList:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        next:
          type: string
    Receipt:
      type: object
      properties:
        orderId:
          type: string
        lines:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
